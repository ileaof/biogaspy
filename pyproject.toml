[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biogassim"
version = "0.1.0"
description = "Simulador científico de upgrading de biogás (remoção de CO2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BioGasSim contributors" }]
keywords = ["biogas", "upgrading", "biomethane", "CO2 capture", "process simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "pandas>=2.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
dev = ["pytest>=7.0"]

[project.scripts]
biogassim = "biogassim.cli:main"

[tool.setuptools.packages.find]
include = ["biogassim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]